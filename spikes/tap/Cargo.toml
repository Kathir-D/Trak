[package]
name = "tap-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cidre = { version = "0.29", default-features = false, features = ["core_audio", "cf", "ns", "ca", "cat", "av", "app", "objc", "blocks", "dispatch", "macos_14_2"] }
# For the tap-objc2 bin only. CATapDescription has no objc2 bindings, so the class is
# reached through the raw runtime instead -- see docs/AUDIO-TAP.md 3c.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }

[workspace]

[package]
name = "trak"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, interactive terminal UI for the Spotify desktop app on macOS"
license = "MIT"
repository = "https://github.com/Kathir-D/trak"
homepage = "https://github.com/Kathir-D/trak"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "macos", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
# The PlaybackStateChanged observer (docs/APPLESCRIPT.md section 9). A plain
# un-bundled CLI receives the notification, so no app bundle is needed; see
# spikes/notify, which is the proof.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSNotification",
    "NSString",
    "NSValue",
    "NSDictionary",
    "NSArray",
    "NSObject",
] }
ratatui-image = "8.0.1"
image = "0.25"
# The Web API (Version A). Blocking on purpose: trak's loop is a single thread
# and a token refresh, a search or a playlist fetch all happen on a worker
# behind a trait. An async client would drag a runtime into the TUI for no gain.
ureq = "3"
# Version A's JSON surface is large and every response is a typed struct, so
# serde earns its keep there. The three hand-written readers in lyrics.rs,
# sonar.rs and headless.rs predate this and are left alone: refactoring them is
# not part of any task, and they are small enough that a rewrite would be churn.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PKCE (TODO 7.2). The verifier has to be high-entropy random and its S256
# challenge hashed, and the token file is base64url JSON.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Spotify is read and written through AppleScript only, so osascript is the
# transport. objc2-foundation carries the PlaybackStateChanged observer
# (docs/APPLESCRIPT.md section 9): a plain CLI can receive it, no bundle needed.

# A probe that measures the notification's arrival latency against a real
# Spotify, because that number is TODO 3.9's done-when and cannot be asserted
# in a unit test.
[[example]]
name = "notify-probe"

# A probe that reports the accent a cover produces, and why when it produces
# none. "This sleeve got no colour" is either the filter working or a bug, and
# this is how you tell them apart without a debugger.
[[example]]
name = "accent-probe"

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2.29"
predicates = "3"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

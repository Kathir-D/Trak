[package]
name = "trak"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, interactive terminal UI for the Spotify desktop app on macOS"
license = "MIT"
repository = "https://github.com/Kathir-D/trak"
homepage = "https://github.com/Kathir-D/trak"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "macos", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# Spotify is read and written through AppleScript only, so osascript is the
# transport. objc2-foundation carries the PlaybackStateChanged observer
# (docs/APPLESCRIPT.md section 9): a plain CLI can receive it, no bundle needed.

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
